name: Deploy Supabase Edge Functions

# Deploys the site's edge function to the self-managed Supabase project whenever
# its source changes on main. Runs in GitHub CI (Docker available), so it avoids
# the local "Docker network" failure. Never touches the frontend/Vercel deploy.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token (sbp_...)
#   SUPABASE_PROJECT_ID    — the project ref (enwbfsbcxoqqnbkrngyb)
# Optional (only if you want CI to also set the Gemini key):
#   GEMINI_API_KEY         — your Google AI Studio key

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy make-server-df4bb120
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID repository secret."
            exit 1
          fi
          # verify_jwt stays false so public routes (anon key) and the cron
          # dispatch (x-cron-secret, no Authorization header) keep working.
          supabase functions deploy make-server-df4bb120 \
            --project-ref "$PROJECT_ID" \
            --no-verify-jwt

      # Note: the `secrets` context is NOT allowed in step `if:` conditions, so
      # the emptiness check is done inside the run step via an env var instead.
      - name: Set GEMINI_API_KEY secret (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set "GEMINI_API_KEY=$GEMINI_API_KEY" \
              --project-ref "$PROJECT_ID"
          else
            echo "GEMINI_API_KEY not set — skipping."
          fi

      - name: Set CRON_SECRET secret (optional)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            supabase secrets set "CRON_SECRET=$CRON_SECRET" \
              --project-ref "$PROJECT_ID"
          else
            echo "CRON_SECRET not set — skipping."
          fi
