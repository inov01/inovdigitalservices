<!doctype html>
<html lang="fr">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INOV Digital Services — Branding, Logos &amp; Design</title>

    <!-- SEO — static defaults match the site's primary language (fr = <html lang>);
         applySeo() rewrites title/description/OG/canonical/hreflang per language on load. -->
    <meta name="description" content="Studio de branding en Haïti : logos, packaging, affiches, motion design et design web &amp; UI/UX. 20+ marques, 80+ visuels livrés. Livraison dès 48h." />
    <meta name="theme-color" content="#f7601b" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://inovdigitalservices.com/" />

    <!-- Fonts — preconnect first so the browser opens the TLS connection early,
         then fetch the stylesheet (not a render-blocking CSS @import). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
    />

    <!-- Icons & PWA manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="INOV Digital Services" />
    <meta property="og:title" content="INOV Digital Services — Branding, Logos &amp; Design" />
    <meta property="og:description" content="Studio de branding en Haïti : logos, packaging, affiches, motion design et design web &amp; UI/UX. 20+ marques, 80+ visuels livrés. Livraison dès 48h." />
    <meta property="og:image" content="https://inovdigitalservices.com/og-image.png" />
    <meta property="og:url" content="https://inovdigitalservices.com/" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INOV Digital Services — Branding, Logos &amp; Design" />
    <meta name="twitter:description" content="Studio de branding en Haïti : logos, packaging, affiches, motion design et design web &amp; UI/UX. 20+ marques, 80+ visuels livrés. Livraison dès 48h." />
    <meta name="twitter:image" content="https://inovdigitalservices.com/og-image.png" />

    <!-- Structured data + absolute URLs, resolved against the live origin so no
         domain is hard-coded. Injected into <head> only — no visible effect. -->
    <script>
      (function () {
        try {
          var origin = window.location.origin;
          var img = origin + "/og-image.png";
          var setAttr = function (sel, attr, val) {
            var el = document.querySelector(sel);
            if (el) el.setAttribute(attr, val);
          };
          setAttr('link[rel="canonical"]', "href", origin + "/");
          setAttr('meta[property="og:url"]', "content", origin + "/");
          setAttr('meta[property="og:image"]', "content", img);
          setAttr('meta[name="twitter:image"]', "content", img);

          var ld = {
            "@context": "https://schema.org",
            "@type": "ProfessionalService",
            "name": "INOV Digital Services",
            "description": "Studio de branding et design : logos, packaging, affiches, motion design et sites vitrines. 20+ marques accompagnées, 80+ visuels livrés.",
            "url": origin + "/",
            "logo": img,
            "image": img,
            "telephone": "+50936255920",
            "priceRange": "$$",
            "areaServed": [
              { "@type": "Country", "name": "Haïti" },
              { "@type": "Country", "name": "Canada" },
              { "@type": "Country", "name": "France" },
              { "@type": "Country", "name": "United States" }
            ],
            "address": { "@type": "PostalAddress", "addressCountry": "HT" },
            "founder": { "@type": "Person", "name": "Ben-vino" },
            "sameAs": [
              "https://instagram.com/inov_digital_services",
              "https://wa.me/50936255920"
            ],
            "knowsLanguage": ["fr", "en", "es", "ht", "pt", "it", "de", "ar"]
          };
          var s = document.createElement("script");
          s.type = "application/ld+json";
          s.text = JSON.stringify(ld);
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
